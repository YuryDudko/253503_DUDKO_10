{% extends "base.html" %}

{% block meta %}
    <!-- SEO и метаданные для страницы FAQ -->
    <meta name="description" content="Часто задаваемые вопросы по бытовой химии. Узнайте больше о продуктах и услугах компании.">
    <meta name="keywords" content="бытовая химия, вопросы, ответы, faq, бытовая продукция">
    <meta property="og:title" content="Словарь терминов и понятий - Часто задаваемые вопросы">
    <meta property="og:description" content="Наиболее часто задаваемые вопросы по бытовой химии и наши ответы.">
{% endblock %}

{% block content %}
    <section itemscope itemtype="https://schema.org/FAQPage" class="faq-section">
        <h2>Словарь терминов и понятий</h2>
        <ul>
            {% for faq in faq_list %}
            <li itemscope itemprop="mainEntity" itemtype="https://schema.org/Question" class="faq-item">
                <!-- Вопрос -->
                <details class="faq-details">
                    <summary itemprop="name" class="faq-question">
                        <span>{{ faq.question }}</span>
                    </summary>
                    <div itemscope itemprop="acceptedAnswer" itemtype="https://schema.org/Answer" class="faq-answer">
                        <!-- Ответ -->
                        <p itemprop="text">{{ faq.answer }}</p>
                        <p class="faq-date">Добавлено: {{ faq.date_added }}</p>
                    </div>
                </details>
            </li>
            {% endfor %}
        </ul>
    </section>
{% endblock %}
