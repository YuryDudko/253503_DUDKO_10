{% extends "base.html" %}

{% block content %}
<section class="vacancies">
    <h2>Вакансии</h2>

        {% for vacancy in vacancies_list %}
        <li class="vacancy-item">
            <h3>{{ vacancy.title }}</h3>
            <p>{{ vacancy.description }}</p>
        </li>
        {% endfor %}
    </ul>
</section>
{% endblock %}
