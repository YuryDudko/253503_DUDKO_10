{% extends "base.html" %}
{% block content %}
<h2>Новости</h2>
<ul>
    {% for article in articles %}
    <article>
        <header>
            <h3><a href="{% url 'news_detail' article.id %}">{{ article.title }}</a></h3>
        </header>
        <figure>
            <img src="{{ article.image.url }}" alt="{{ article.title }}">
            <figcaption>{{ article.title }}</figcaption>
        </figure>
        <p>{{ article.short_description }}</p>
        <footer>
            <a href="{% url 'news_detail' article.id %}" class="read-more">Читать далее</a>
        </footer>
    </article>
    {% endfor %}
</ul>
<a href="{% url 'create_news' %}">Добавить новость</a>
{% endblock %}
