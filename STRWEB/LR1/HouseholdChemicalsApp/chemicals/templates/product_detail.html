{% extends "base.html" %}

{% block content %}
<h2>{{ product.name }}</h2>
<img src="{{ product.image.url }}" alt="{{ product.name }}">
<p>Цена: {{ product.price }}</p>
<p>Описание: {{ product.description }}</p>

<form method="post" action="{% url 'add_to_cart_item' product.id %}">
    {% csrf_token %}
    <button type="submit">Добавить в корзину</button>
</form>
{% endblock %}
